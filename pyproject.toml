[project]
name = "kanga-sideload"
version = "0.3.0"
description = "Sideloader iOS open source per Windows (firma + installazione con account Apple gratuito)"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "pymobiledevice3>=11.50",
    "anisette>=1.2.4",
    "PySide6>=6.8",
    "requests>=2.32",
    "cryptography>=43",
    # NOTA: pysrp è vendorizzato in kanga/core/_vendor/srp (MIT, cocagne/pysrp)
    # perché su PyPI il nome 'pysrp' è stato riutilizzato da un pacchetto diverso.
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
kanga-sideload = "kanga.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.uv]
# assicura che la venv locale .venv sia usata

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kanga*"]
